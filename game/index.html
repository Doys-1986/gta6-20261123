<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Harbor: Neon Streets — an original open-world crime game</title>
<meta name="description" content="Vice Harbor: Neon Streets is an original top-down 2D open-world crime game in vanilla JavaScript and canvas. Explore Port Solana on foot and by car, run missions, and evade the PSPD.">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131c; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: crosshair;
  }
  /* Visually hidden live region: the game narrates cash, wanted level
     and the current objective here for assistive technology. */
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Harbor Neon Streets: explore Port Solana on foot and by car, run missions and evade the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- One module per job, loaded in dependency order: the city first,
     then sound, traffic, police and missions, then rendering, and
     finally main.js which wires everything together. -->
<script type="module" src="./js/city.js"></script>
<script type="module" src="./js/sound.js"></script>
<script type="module" src="./js/traffic.js"></script>
<script type="module" src="./js/police.js"></script>
<script type="module" src="./js/missions.js"></script>
<script type="module" src="./js/render.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
